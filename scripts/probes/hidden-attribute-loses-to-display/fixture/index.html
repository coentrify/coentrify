<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Notes</h1>
      <input id="search" type="search" placeholder="Search" />
      <button id="new-note" type="button">New note</button>
      <button id="menu-button" type="button" aria-haspopup="true">Menu</button>
      <div id="menu" class="menu" hidden>
        <button type="button" data-action="export">Export</button>
        <button type="button" data-action="clear">Clear all</button>
      </div>
    </header>
    <main>
      <ul id="notes" class="notes"></ul>
      <p id="empty" class="empty" hidden>No notes match.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
