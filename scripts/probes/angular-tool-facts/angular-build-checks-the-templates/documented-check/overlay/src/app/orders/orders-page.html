<app-section title="Orders">
  @for (order of orders(); track order.id) {
    <app-order-card [order]="order" (details)="opened.set($event)" />
  } @empty {
    <p class="section__empty">No orders yet.</p>
  }
  @if (opened(); as id) {
    <p>Order {{ id }} is open.</p>
  }
  <p class="largest">Largest order: <app-contact-line [contact]="largest()" /></p>
</app-section>
